plugins {
    id 'com.android.application'
}

android {
    namespace 'org.fathomstudios.skylauncher.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.fathomstudios.skylauncher.android'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '0.1.1-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
