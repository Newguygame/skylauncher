plugins {
    id 'com.android.application'
}

android {
    namespace 'org.fathomstudios.skylauncher.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.fathomstudios.skylauncher.android.independent'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName 'independent-engine-dev'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
