name: SkyLauncher Independent Android (test-only)
on:
  push:
    branches: [feature/android-independent-engine]
    paths:
      - 'android-independent/**'
      - '.github/workflows/android-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify standalone Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform (runner SDK)
        run: |
          set -e
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK command line tools missing"
            exit 1
          fi
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" || true
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$ANDROID_HOME/cmake/3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle verified ARM64 OpenJDK 21 runtime (not launcher code)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-independent/app/src/main/assets
          curl -fL --retry 3 --max-time 180 \
            -o android-independent/app/src/main/assets/jre21-android-arm64.tar.xz \
            "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre21/jre21-android-arm64.tar.xz"
          echo "8d41ec401ee59f7722df60ed991f81ad146e130452804bfdd8a05d3436f7bbfe  android-independent/app/src/main/assets/jre21-android-arm64.tar.xz" | sha256sum -c -
          echo "SkyLauncher standalone OpenJDK runtime archive verified"
      - name: Build independent app (no upstream engine checkout)
        working-directory: android-independent
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify generated test APK
        run: test -s android-independent/app/build/outputs/apk/debug/app-debug.apk
      - name: Keep debug APK as temporary test artifact (NOT release)
        uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Independent-Android-Dev
          path: android-independent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
