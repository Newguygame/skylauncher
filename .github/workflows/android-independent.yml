name: SkyLauncher Independent Android (test-only)
on:
  push:
    branches: [feature/android-independent-engine]
    paths:
      - 'android-independent/**'
      - '.github/workflows/android-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify standalone Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build independent app (no upstream engine checkout)
        working-directory: android-independent
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify generated test APK
        run: test -s android-independent/app/build/outputs/apk/debug/app-debug.apk
      - name: Keep debug APK as temporary test artifact (NOT release)
        uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Independent-Android-Dev
          path: android-independent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
