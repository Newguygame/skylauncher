name: Publish SkyLauncher Android download

# Manual publishing only. Test APKs stay in Actions artifacts for chat delivery.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: skylauncher-android-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish APK to stable Android download URL
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'feature/android-integrated-engine') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download latest successful integrated Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-engine.yml/runs?branch=feature/android-integrated-engine&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::No successful integrated Android workflow run found."
            exit 1
          fi
          echo "Using verified Android build run $RUN_ID"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n "SkyLauncher-Android-Integrated-Engine-Experimental" -D android-apk
          test -s android-apk/app_pojavlauncher-debug.apk
          cp android-apk/app_pojavlauncher-debug.apk SkyLauncher-Android.apk
          echo "source_run=$RUN_ID" >> "$GITHUB_ENV"
          sha256sum SkyLauncher-Android.apk

      - name: Publish rolling experimental Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest SkyLauncher-Android.apk \
              --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create android-latest SkyLauncher-Android.apk \
              -R "$GITHUB_REPOSITORY" \
              --target feature/android-integrated-engine \
              --title "SkyLauncher Android (Experimental)" \
              --notes "Integrated Minecraft Java engine for Android. Debug-signed experimental APK. Latest verified Android Actions build: #${source_run}. Does not replace desktop releases." \
              --prerelease
          fi
          gh release view android-latest -R "$GITHUB_REPOSITORY" \
            --json assets,url,isPrerelease --jq '{url, isPrerelease, assets:[.assets[].name]}'
