name: Build SkyLauncher native offline installers
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/copy_assets.sh'
      - 'icons/**'
      - 'build-local.sh'
      - 'build-windows-full-offline.ps1'
      - 'windows-installer/SkyLauncher.iss'
      - 'tests/test_windows_installer.ps1'
      - '.github/workflows/build.yml'
      - 'linux-portable/**'
      - 'tests/test_linux_portable.sh'
      - 'README.md'
permissions:
  contents: write
jobs:
  verify:
    name: Cross-platform tests before packaging
    uses: ./.github/workflows/test.yml
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: exe
            name: SkyLauncher
            icon: ico
            label: Windows
          - os: macos-15-intel
            package: dmg
            name: SkyLauncher
            icon: icns
            label: macOS-Intel
            mac_arch: intel
          - os: macos-15
            package: dmg
            name: SkyLauncher
            icon: icns
            label: macOS-Apple-Silicon
            mac_arch: arm64
          - os: ubuntu-24.04
            package: deb
            name: skylauncher
            icon: png
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build launchable JAR from repository files
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/classes build/launcher input dist
          javac --release 17 -encoding UTF-8 -d build/classes src/SkyLauncher.java
          find build/classes -maxdepth 1 -name 'SkyLauncher*.class' -exec cp {} build/launcher/ \;
          bash scripts/copy_assets.sh build/launcher
          for icon in png ico icns; do test -s "icons/SkyLauncher.$icon" && mkdir -p build/launcher/icons && cp "icons/SkyLauncher.$icon" build/launcher/icons/; done
          jar --create --file input/SkyLauncher.jar --main-class SkyLauncher -C build/launcher .
          java -jar input/SkyLauncher.jar --selftest
      - name: Install Inno Setup for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup could not be installed.' }
          }
          if (!(Test-Path $compiler)) { throw 'Inno Setup could not be found.' }
      - name: Build and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build-windows-full-offline.ps1 -TestInstaller
      - name: Build native macOS and Linux packages with bundled Java
        if: runner.os != 'Windows'
        shell: bash
        run: |
          icon_arg=()
          if [[ -f 'icons/SkyLauncher.${{ matrix.icon }}' ]]; then icon_arg=(--icon 'icons/SkyLauncher.${{ matrix.icon }}'); fi
          jpackage --type '${{ matrix.package }}' --name '${{ matrix.name }}' --app-version 3.1.7 \
            --input input --main-jar SkyLauncher.jar --main-class SkyLauncher \
            --dest dist --vendor SkyLauncher "${icon_arg[@]}" \
            --description 'SkyLauncher native installer - application and Java bundled locally'
      - name: Identify macOS installer architecture in filename
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.mac_arch }}
        run: |
          shopt -s nullglob
          packages=(dist/*.dmg)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one macOS DMG, found ${#packages[@]}" >&2
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            mv -- "$pkg" "${pkg%.dmg}-${MAC_ARCH}.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Offline-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
      - name: Upload portable JAR
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Portable-JAR
          path: input/SkyLauncher.jar
  linux-portable:
    name: Portable Linux (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older glibc on x64 improves compatibility with many Linux distributions.
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and verify Java launcher
        shell: bash
        run: |
          mkdir -p build/portable/classes
          javac --release 17 -encoding UTF-8 -d build/portable/classes src/SkyLauncher.java
          bash scripts/copy_assets.sh build/portable/classes
          jar --create --file build/SkyLauncher.jar --main-class SkyLauncher -C build/portable/classes .
          java -jar build/SkyLauncher.jar --selftest
      - name: Package Linux portable archive (includes Java)
        shell: bash
        run: bash linux-portable/package.sh build/SkyLauncher.jar dist --bundle-java --arch '${{ matrix.arch }}'
      - name: Make Java-required portable archive (x64 job only)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: bash linux-portable/package.sh build/SkyLauncher.jar dist
      - name: Verify extract, launch, install, and uninstall
        shell: bash
        run: |
          for package in dist/*.tar.gz; do
            bash tests/test_linux_portable.sh "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Portable-Linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish-portable:
    # Make the verified JAR available without waiting for third-party Mac runners.
    # This GITHUB_TOKEN push would not trigger another workflow from a new tag,
    # so the current main-branch workflow publishes the release directly.
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release SkyLauncher 3.1.7')
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Package and test portable JAR
        shell: bash
        run: |
          mkdir -p build/portable-release
          javac --release 17 -encoding UTF-8 -d build/portable-release src/SkyLauncher.java
          bash scripts/copy_assets.sh build/portable-release
          jar --create --file SkyLauncher.jar --main-class SkyLauncher -C build/portable-release .
          java -jar SkyLauncher.jar --selftest
      - name: Publish verified portable JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v3.1.7
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title 'SkyLauncher 3.1.7' --notes 'SkyLauncher 3.1.7 adds in-place updates. Windows/macOS/Linux installers and portable Java packages will appear as soon as their platform builds complete. Minecraft worlds, packs and settings are preserved.'
          fi
          gh release upload "$TAG" SkyLauncher.jar --clobber
  publish:
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release SkyLauncher 3.1.7'))) && needs.build.result == 'success' && needs.linux-portable.result == 'success'
    needs: [build, linux-portable, publish-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SkyLauncher-Offline-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: SkyLauncher-Portable-*
          path: release-assets
          merge-multiple: true
      - name: Include the universal Mac and Linux installers
        shell: bash
        run: |
          cp installers/macOS/SkyLauncher-Universal-macOS-Installer.zip release-assets/
          cp installers/linux/SkyLauncher-Universal-Linux-Installer.zip release-assets/
      - name: Check published installer files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          assets = Path('release-assets')
          names = {p.name for p in assets.iterdir()}
          expected = {'SkyLauncher-3.1.7.exe', 'SkyLauncher-Universal-macOS-Installer.zip',
                      'SkyLauncher-Universal-Linux-Installer.zip', 'SkyLauncher.jar'}
          if not expected.issubset(names): raise SystemExit(f'Missing release assets: {expected - names}')
          for name in ['SkyLauncher-Universal-macOS-Installer.zip', 'SkyLauncher-Universal-Linux-Installer.zip']:
              with ZipFile(assets / name) as z:
                  script = next(p for p in z.namelist() if p.endswith(('.sh', '.command')))
                  code = z.read(script).decode('utf-8')
                  if 'n|N|no|NO|No) return 1' not in code:
                      raise SystemExit(f'Universal installer does not default to Yes: {name}')
          PY
      - name: Publish installers and JAR to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v3.1.7' }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "SkyLauncher 3.1.7" --notes "SkyLauncher 3.1.7: visual home screen, four user-provided selectable wallpapers, terminal style, generic RAM defaults and per-pack overrides, CurseForge VPS mod/modpack search and download, Modrinth and Fathom pack updates, compatible mods filter. Java is bundled in native Windows/macOS/Linux installers; a portable JAR is also included. API keys remain on the VPS."
          fi
          gh release upload "$TAG" release-assets/* --clobber
