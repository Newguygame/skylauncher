name: SkyLauncher Android APK (prototype)

on:
  push:
    branches: [feature/android-prototype]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API 36 SDK
        run: |
          echo "SDK at $ANDROID_HOME"
          yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Copy official desktop icon and wallpaper assets
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp icons/SkyLauncher.png android/app/src/main/res/drawable-nodpi/skylauncher_desktop.png
          for i in 1 2 3 4; do
            test -s "assets/background-$i.jpg"
            cp "assets/background-$i.jpg" "android/app/src/main/res/drawable-nodpi/skylauncher_bg_$i.jpg"
          done
      - name: Build SkyLauncher Android
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK (debug key; not suitable for seamless upgrades)
        uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The private keystore is stored only as a GitHub Actions repository
      # secret, NEVER as a tracked file in the public Git repository.
      - name: Prepare stable signing key
        id: stable_key
        env:
          KEYSTORE_B64: ${{ secrets.SKYLAUNCHER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/skylauncher-release.jks"
            chmod 600 "$RUNNER_TEMP/skylauncher-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed Android release skipped: configure the private signing repository secrets."
          fi

      - name: Build stably signed release APK
        if: steps.stable_key.outputs.enabled == 'true'
        env:
          SKYLAUNCHER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/skylauncher-release.jks
          SKYLAUNCHER_ANDROID_STORE_PASSWORD: ${{ secrets.SKYLAUNCHER_ANDROID_STORE_PASSWORD }}
          SKYLAUNCHER_ANDROID_KEY_ALIAS: ${{ secrets.SKYLAUNCHER_ANDROID_KEY_ALIAS }}
          SKYLAUNCHER_ANDROID_KEY_PASSWORD: ${{ secrets.SKYLAUNCHER_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$SKYLAUNCHER_ANDROID_STORE_PASSWORD"
          test -n "$SKYLAUNCHER_ANDROID_KEY_ALIAS"
          test -n "$SKYLAUNCHER_ANDROID_KEY_PASSWORD"
          gradle -p android assembleRelease --no-daemon --stacktrace
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk SkyLauncher-Android.apk

      - name: Upload stable signed Android release APK
        if: steps.stable_key.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Android-Signed-APK
          path: SkyLauncher-Android.apk
          if-no-files-found: error

      - name: Publish signed Android release for in-app updates
        if: startsWith(github.ref, 'refs/tags/android-v') && steps.stable_key.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SkyLauncher-Android.apk \
            --title "SkyLauncher Android ${GITHUB_REF_NAME#android-v}" \
            --notes "Android APK signed with the stable SkyLauncher key. Android updates require matching signing certificates."

      - name: Reject release tag without stable signing key
        if: startsWith(github.ref, 'refs/tags/android-v') && steps.stable_key.outputs.enabled != 'true'
        run: |
          echo "::error::Refusing to publish an unsigned Android update. Set the signing repository secrets."
          exit 1

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/skylauncher-release.jks"
