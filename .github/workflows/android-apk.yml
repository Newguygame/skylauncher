name: SkyLauncher Android APK (prototype)

on:
  push:
    branches: [feature/android-prototype]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API 36 SDK
        run: |
          echo "SDK at $ANDROID_HOME"
          yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Copy official desktop icon and wallpaper assets
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp icons/SkyLauncher.png android/app/src/main/res/drawable-nodpi/skylauncher_desktop.png
          for i in 1 2 3 4; do
            test -s "assets/background-$i.jpg"
            cp "assets/background-$i.jpg" "android/app/src/main/res/drawable-nodpi/skylauncher_bg_$i.jpg"
          done
      - name: Build SkyLauncher Android
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Android-Prototype-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
