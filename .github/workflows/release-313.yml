name: Publish SkyLauncher 3.1.3 portable JAR
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-313.yml'
permissions:
  contents: write
jobs:
  publish-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test portable JAR
        shell: bash
        run: |
          mkdir -p build/portable313
          javac --release 17 -encoding UTF-8 -d build/portable313 src/SkyLauncher.java
          bash scripts/copy_assets.sh build/portable313
          jar --create --file SkyLauncher.jar --main-class SkyLauncher -C build/portable313 .
          java -jar SkyLauncher.jar --selftest
      - name: Create v3.1.3 tag and publish portable asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v3.1.3 >/dev/null 2>&1; then
            gh release create v3.1.3 --target "$GITHUB_SHA" --title "SkyLauncher 3.1.3" \
              --notes "SkyLauncher 3.1.3 includes the visual home screen, four selectable Minecraft wallpapers, terminal style, generic modpack settings, compatible-mod search, and public CurseForge/Modrinth support. The CurseForge API key remains on the VPS. Portable Java JAR requires Java 17+. Native installers and Linux portable packages are produced by the multi-platform build workflow."
          fi
          gh release upload v3.1.3 SkyLauncher.jar --clobber
