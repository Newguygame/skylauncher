name: Publish SkyLauncher 3.1.8 Intel macOS DMG
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-macos-intel-318.yml'

permissions:
  contents: write

jobs:
  publish-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified platform-neutral v3.1.8 JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p input dist
          gh release download v3.1.8 --pattern 'SkyLauncher.jar' --dir input
          test -s input/SkyLauncher.jar
          java -jar input/SkyLauncher.jar --selftest
      - name: Package Intel macOS application with bundled Java
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type dmg --name SkyLauncher --app-version 3.1.8 \
            --input input --main-jar SkyLauncher.jar --main-class SkyLauncher \
            --dest dist --vendor SkyLauncher --icon icons/SkyLauncher.icns \
            --description 'SkyLauncher native Intel macOS installer - Java bundled'
          packages=(dist/*.dmg)
          if [[ ${#packages[@]} -ne 1 ]]; then echo 'Expected exactly one DMG' >&2; exit 1; fi
          mv -- "${packages[0]}" dist/SkyLauncher-3.1.8-intel.dmg
          test -s dist/SkyLauncher-3.1.8-intel.dmg
      - name: Publish Intel DMG to official v3.1.8 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v3.1.8 dist/SkyLauncher-3.1.8-intel.dmg --clobber
