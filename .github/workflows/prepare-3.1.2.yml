name: Clean up SkyLauncher 3.1.2 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-3.1.2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove internal test file from release
    runs-on: ubuntu-latest
    steps:
      - name: Remove the internal CI JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset v3.1.2 SkyLauncher-ci.jar --repo "$GH_REPO" --yes
