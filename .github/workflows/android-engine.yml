name: SkyLauncher Android Integrated Minecraft Engine (experimental)

on:
  push:
    branches: [feature/android-integrated-engine]
    paths:
      - 'android-engine/**'
      - '.github/workflows/android-engine.yml'
      - 'android/**'
  pull_request:
    branches: [main]
    paths:
      - 'android-engine/**'
      - '.github/workflows/android-engine.yml'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-engine:
    name: Compile single-APK SkyLauncher Minecraft engine
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout SkyLauncher
        uses: actions/checkout@v4

      - name: Checkout pinned Android Minecraft engine source
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: a743e284382fdcbd3f809d483b8a7a92483b5341
          path: engine-upstream
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Install Android SDK and NDK for native engine
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android command-line tools missing on runner."
            find "$ANDROID_HOME" -maxdepth 3 -type f -name sdkmanager || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" || true
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Get engine's OpenJDK 8 runtime from upstream's public CI
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: engine-upstream/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Apply SkyLauncher UI, profile manager, icon and built-in game launcher
        run: |
          python3 android-engine/build_integrated_engine.py \
            --skylauncher . --upstream engine-upstream
          grep -q 'applicationId "org.fathomstudios.skylauncher.android"' engine-upstream/app_pojavlauncher/build.gradle
          grep -q 'SkyLauncher' engine-upstream/app_pojavlauncher/src/main/AndroidManifest.xml
          test -s engine-upstream/app_pojavlauncher/src/main/res/drawable-nodpi/skylauncher_desktop.png

      - name: Generate language list
        working-directory: engine-upstream
        run: |
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh

      - name: Build combined Android APK
        working-directory: engine-upstream
        run: gradle :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s engine-upstream/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          ls -lh engine-upstream/app_pojavlauncher/build/outputs/apk/debug/*.apk

      - name: Upload integrated SkyLauncher Minecraft APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyLauncher-Android-Integrated-Engine-Experimental
          path: engine-upstream/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          if-no-files-found: error
          retention-days: 14
